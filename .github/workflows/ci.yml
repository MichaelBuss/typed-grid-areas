name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  release-guidance:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: guidance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed.txt
          node scripts/release-guidance.ts --changed-files /tmp/changed.txt
      - name: Post release guidance as an informational PR comment
        env:
          DETAIL: ${{ steps.guidance.outputs.detail }}
          MARKDOWN: ${{ steps.guidance.outputs.markdown }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DETAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          MARKER="<!-- typed-grid-areas-release-guidance -->"
          {
            printf '%s\n\n' "$MARKER"
            printf '%s\n' "$MARKDOWN"
          } > /tmp/comment.md
          EXISTING="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | awk 'NR==1')"
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/comment.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@/tmp/comment.md
          fi
          echo "::notice::${DETAIL}"
