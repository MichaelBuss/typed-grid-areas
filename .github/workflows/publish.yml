name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # scripts/release.ts tags each package it publishes at this commit, so
      # a tag here means this run released something (a push that only opens
      # or updates the Version Packages PR tags nothing).
      - id: released
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
