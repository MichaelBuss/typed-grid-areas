name: Docs site

# Builds packages/site and deploys it to GitHub Pages
# (https://michaelbuss.github.io/typed-grid-areas/). The release workflow
# calls it after a release is published, so the site never documents
# unreleased API; dispatch it by hand to redeploy (for example once Pages is
# turned on), from `main` or a release tag. Never runs on a plain push.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:core
      - run: npm run build -w @typed-grid-areas/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
